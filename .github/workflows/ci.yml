name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.23'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run Go scanner tests
        working-directory: scanner
        run: go test -v ./...

      - name: Install npm dependencies
        run: npm ci

      - name: Build Go scanner binary
        run: npm run build:scanner

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Build Electron and React bundle
        run: npm run build
